# The `remote` agent preset: server-development mode.
#
# The agent's working environment is a REMOTE Linux server reached over SSH.
# Local shell/fs tools are NOT mounted: commands run on the server, files are
# read/written over SFTP, and the server's own toolchain (compilers, package
# managers) is used directly.
#
# ── how the pieces connect ──────────────────────────────────────────────────
#
# * The ssh_* tools (ssh_list / ssh_exec / ssh_ls / ssh_read / ssh_write) and
#   the shared SshRuntime (ctx.ssh) live in the HOST composition (plugin row in
#   cordis.patch.yml; see src/index.ts). They are global — every agent sees the
#   tools, and the runtime owns the ONE connection pool.
#
# * The capability adapters (fs-ssh / subprocess-ssh) and the model-facing
#   tools that consume them are PRESET-scoped. A service row in an agent-plane
#   composition MUST sit inside a group carrying an `isolate` realm — without
#   one it publishes into the root realm (process-global) and `dsh-agent-presets`
#   rejects the mount. `true` means an entry-local realm: one private instance
#   per mounted session, invisible to ordinary sessions (they keep the local
#   sandboxed fs / subprocess on the host).
#
# * Rows inside one `isolate` group share its realm: fs-ssh provides `fs`,
#   subprocess-ssh provides `subprocess`, pty provides `terminals`, and the
#   tools mounted beside them resolve THOSE instances. Injections that leave
#   the realm (`ssh`, `sandboxPolicy`, `systemPrompt`, `tools`) resolve up the
#   fiber chain to the host plane. So `read_file`/`write`/`edit`/grep/glob/
#   `str_replace_editor`/persistent terminals all land on the remote server.
#
# * tool-bash is deliberately NOT mounted: its executor consumes `ctx.shell`,
#   for which no remote implementation exists yet — the model's shell on the
#   server is ssh_exec instead.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model, working on a
      REMOTE Linux server via SSH. Your working environment IS the server —
      commands run on the server, files are read/written over SFTP, and the
      server's own toolchain (compilers, package managers) is used directly.

      PRIMARY RULE — check the workspace first. If the session workspace
      (current working directory) is under ~/.dsh/remote/, it is a placeholder
      for a remote directory: you are ALREADY connected to that host and
      directory. Do not ask which host to use and do not call ssh_list to
      reconnect — just work: relative paths resolve on the remote directory,
      and the standard file/search/editor/terminal tools all operate on the
      server. The host alias is the placeholder path segment right after
      ~/.dsh/remote/ (it may look base64-encoded in the directory name; that
      is expected).

      Otherwise (local workspace or no workspace): pick a host with ssh_list
      and start working with ssh_exec / ssh_ls / ssh_read / ssh_write. When
      the user wants a specific remote directory (e.g. "work on
      /srv/my-app on web-1"), create a persistent workspace binding with
      ssh_workspace (action: create) and tell the user to select the printed
      local path as the workspace for future sessions — sessions started in
      that directory run on the remote directory automatically.

      Standard development tools (read_file/write/edit, grep/glob,
      str_replace_editor, persistent terminals) target the server through
      SSH-backed adapters, so use them as you normally would.

# ── remote capability realm ────────────────────────────────────────────────
# Services + their consumers share one entry-local realm per mounted session.
# Order matters for clarity only — the loader wires inject dependencies.

- id: remote-caps
  name: cordis:group
  group: true
  isolate:
    fs: true
    subprocess: true
    terminals: true
  config:
    - id: fs-ssh
      name: 'dsh-remote-ide/fs-ssh'

    - id: subprocess-ssh
      name: 'dsh-remote-ide/subprocess-ssh'

    # Model-facing tools that resolve the SSH-backed adapters above.
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # Persistent terminals: the PTY registry is agent-owned, and its bash
    # backend spawns through the SSH subprocess adapter (remote PTY shells).
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        pollIntervalMs: 25
        exactProbeAfterMs: 150
        idleSilenceMs: 2000
        handoffGraceMs: 500
        timeoutMs: 5000
        disposeGraceMs: 1000
